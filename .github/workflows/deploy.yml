name: Actualizar noticias y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # cada día a las 06:00 UTC (07:00/08:00 en España)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar noticias
        if: github.event_name != 'push'
        run: node scripts/update-news.mjs

      - name: Actualizar redes sociales (Wikidata)
        if: github.event_name != 'push'
        run: node scripts/update-socials.mjs

      - name: Guardar noticias y redes en el repo
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet data/; then
            git config user.name "wiki-reality-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json data/socials.json
            git commit -m "Noticias y redes: actualización diaria"
            git push
          fi

      - name: Generar la web
        run: node scripts/build.mjs
        env:
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
